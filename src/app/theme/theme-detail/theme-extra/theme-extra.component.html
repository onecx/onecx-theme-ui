<div class="flex flex-column row-gap-4">
  <div class="mt-4 mx-0 sm:mx-2 text-center border-bottom-1" style="border-color: var(--p-stone-300)">
    <div class="h-1rem mb-2 text-xl text-600 font-bold">{{ 'THEME.GROUPS.FONT' | translate }}</div>
  </div>

  <form [formGroup]="fontForm" class="mx-0 sm:mx-2 flex flex-column sm:flex-row gap-4">
    <div class="flex-grow-1">
      <p-floatlabel variant="on">
        <input
          pInputText
          type="text"
          id="th_detail_font_font_family"
          class="w-full pt-3 pb-2 text-responsive"
          formControlName="font-family"
          [ariaLabel]="'THEME.TOOLTIPS.FONT_FAMILY' | translate"
          [pTooltip]="'THEME.TOOLTIPS.FONT_FAMILY' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="th_detail_font_font_family" aria-hidden="true">{{ 'THEME.FONT_FAMILY' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="flex-grow-1">
      <p-floatlabel variant="on">
        <input
          pInputText
          type="text"
          id="th_detail_font_font_size"
          class="w-full pt-3 pb-2 text-responsive"
          formControlName="font-size"
          [ariaLabel]="'THEME.TOOLTIPS.FONT_SIZE' | translate"
          [pTooltip]="'THEME.TOOLTIPS.FONT_SIZE' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="th_detail_font_font_size" aria-hidden="true">{{ 'THEME.FONT_SIZE' | translate }}</label>
      </p-floatlabel>
    </div>
  </form>

  <div class="mt-4 mx-0 sm:mx-2 text-center border-bottom-1" style="border-color: var(--p-stone-300)">
    <div class="h-1rem mb-2 text-xl text-600 font-bold">{{ 'THEME.GROUPS.CSS' | translate }}</div>
  </div>

  <form [formGroup]="cssForm" class="mx-0 sm:mx-2 flex flex-column sm:flex-row gap-4">
    <div class="flex-grow-1">
      <p-floatlabel variant="on">
        <textarea
          pTextarea
          rows="3"
          type="text"
          id="th_detail_css_custom_css_variables"
          class="w-full pt-3 pb-2 text-responsive"
          formControlName="customCssVariables"
          [ariaLabel]="'THEME.TOOLTIPS.CUSTOM_CSS_VARIABLES' | translate"
          [pTooltip]="'THEME.TOOLTIPS.CUSTOM_CSS_VARIABLES' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        ></textarea>
        <label for="th_detail_css_custom_css_variables" aria-hidden="true">
          {{ 'THEME.CUSTOM_CSS_VARIABLES' | translate }}
        </label>
      </p-floatlabel>
    </div>
  </form>
</div>
