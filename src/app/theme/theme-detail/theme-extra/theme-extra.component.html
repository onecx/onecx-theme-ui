<div class="mt-4 mb-2 mx-0 sm:mx-2 flex flex-column row-gap-4">
  <form [formGroup]="fontForm" class="flex flex-column sm:flex-row gap-4">
    <div class="flex-grow-1">
      <p-floatlabel variant="on">
        <input
          pInputText
          type="text"
          id="th_detail_font_font_family"
          class="w-full pt-3 pb-2 text-responsive"
          formControlName="font-family"
          [ariaLabel]="'THEME.TOOLTIPS.FONT_FAMILY' | translate"
          [pTooltip]="'THEME.TOOLTIPS.FONT_FAMILY' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="th_detail_font_font_family" aria-hidden="true">{{ 'THEME.FONT_FAMILY' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="flex-grow-1">
      <p-floatlabel variant="on">
        <input
          pInputText
          type="text"
          id="th_detail_font_font_size"
          class="w-full pt-3 pb-2 text-responsive"
          formControlName="font-size"
          [ariaLabel]="'THEME.TOOLTIPS.FONT_SIZE' | translate"
          [pTooltip]="'THEME.TOOLTIPS.FONT_SIZE' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        />
        <label for="th_detail_font_font_size" aria-hidden="true">{{ 'THEME.FONT_SIZE' | translate }}</label>
      </p-floatlabel>
    </div>
  </form>

  <form [formGroup]="cssForm" class="">
    <div class="flex-grow-1">
      <p-floatlabel variant="on">
        <textarea
          pTextarea
          rows="3"
          type="text"
          id="th_detail_css_custom_css_variables"
          class="w-full pt-3 pb-2"
          formControlName="customCssVariables"
          [ariaLabel]="'THEME.TOOLTIPS.CUSTOM_CSS_VARIABLES' | translate"
          [pTooltip]="'THEME.TOOLTIPS.CUSTOM_CSS_VARIABLES' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        ></textarea>
        <label for="th_detail_css_custom_css_variables" aria-hidden="true">
          {{ 'THEME.CUSTOM_CSS_VARIABLES' | translate }}
        </label>
      </p-floatlabel>
    </div>
  </form>

  <form [formGroup]="overrideForm" class="flex flex-column gap-4">
    <div class="flex-grow-1">
      <p-floatlabel variant="on">
        <textarea
          pTextarea
          rows="8"
          id="th_detail_override_primeng"
          class="w-full pt-3 pb-2"
          formControlName="primengOverride"
          [ariaLabel]="'THEME.TOOLTIPS.PRIMENG_OVERRIDE' | translate"
          [pTooltip]="'THEME.TOOLTIPS.PRIMENG_OVERRIDE' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        ></textarea>
        <label for="th_detail_override_primeng" aria-hidden="true">{{ 'THEME.PRIMENG_OVERRIDE' | translate }}</label>
      </p-floatlabel>
      @if (overrideForm.controls['primengOverride'].hasError('invalidJson')) {
        <small id="th_detail_override_primeng_error" class="p-error">
          {{ 'VALIDATION.ERRORS.INVALID_JSON' | translate }}
        </small>
      }
    </div>
    <div class="flex-grow-1">
      <p-floatlabel variant="on">
        <textarea
          pTextarea
          rows="8"
          id="th_detail_override_css"
          class="w-full pt-3 pb-2"
          formControlName="cssOverride"
          [ariaLabel]="'THEME.TOOLTIPS.CSS_OVERRIDE' | translate"
          [pTooltip]="'THEME.TOOLTIPS.CSS_OVERRIDE' | translate"
          tooltipPosition="top"
          tooltipEvent="hover"
        ></textarea>
        <label for="th_detail_override_css" aria-hidden="true">{{ 'THEME.CSS_OVERRIDE' | translate }}</label>
      </p-floatlabel>
      @if (overrideForm.controls['cssOverride'].hasError('invalidJson')) {
        <small id="th_detail_override_css_error" class="p-error">
          {{ 'VALIDATION.ERRORS.INVALID_JSON' | translate }}
        </small>
      }
    </div>
  </form>
</div>
