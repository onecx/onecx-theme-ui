@if (imageUrl$ | async; as url) {
  <img
    [id]="imageId() ?? 'th_data_logo_' + themeName()"
    [class]="imageStyleClass() ?? 'border-round-sm max-h-3rem max-w-9rem vertical-align-middle'"
    alt="Theme Logo"
    [ocxSrc]="url"
    aria-label="Theme Logo"
    (error)="onImageLoadError(url)"
    (load)="onImageLoad()"
  />
}
